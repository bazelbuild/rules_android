---

matrix:
  bazel: [
    7.7.1,
    8.5.0,
    last_green,
  ]
  platform: [
    ubuntu2404,
    macos_arm64,
    # windows # TODO: Windows unit tests don't work yet.
  ]

tools_flags: &tools_flags
  ? "--enable_bzlmod=false"
  ? "--enable_workspace=true"
rules_flags: &rules_flags
  ? "--enable_bzlmod=false"
  ? "--enable_workspace=true"
bzlmod_flags: &bzlmod_flags
  <<: *rules_flags
  ? "--enable_bzlmod"
  ? "--enable_workspace=false"

# These flags are used to build the app using the mobile-install aspect
# Note that this does not actually run an install, just validates
# that at least the build part of MI works.
# Note to users: Do NOT run bazel build with these aspect and output_group
# flags. These are for testing purposes only!
mi_aspect_flags: &mi_aspect_flags
  <<: *bzlmod_flags
  # Do NOT put these in your bazelrc. Do NOT use these for mobile-install or build/run/test commands.
  ? "--aspects=@rules_android//mobile_install:mi.bzl%MIASPECT"
  ? "--output_groups=mobile_install_INTERNAL_,mobile_install_launcher_INTERNAL_,-_,-defaults"
  # Latest bazel's JavaBuilder is build at java 21. For some reason the MI aspect + bazel build throws
  # a classcode version conflict, and not the other tests in this presubmit, so the below flag
  # is a crude workaround for that problem.
  ? "--tool_java_runtime_version=21"

tools: &tools
  name: "Tools"
  build_targets:
    - "//android/..."
    - "//src/..."
    - "-//src/java/com/example/sampleapp/..."
    - "//test/..."
    - "-//test/rules/..." # Tested in `rules`
    - "//toolchains/..."
    - "//tools/..."
    - "-//tools/android/..." # TODO(#122): Un-exclude this once #122 is fixed.
  test_targets:
    - "//src/..."
    - "-//src/java/com/example/sampleapp/..."
    - "//test/..."
    - "-//test/rules/..."
  build_flags:
    <<: *tools_flags
  test_flags:
    <<: *tools_flags
tools_bzlmod: &tools_bzlmod
  name: "Tools Bzlmod"
  build_flags:
    <<: *tools_flags
    ? "--enable_bzlmod"
    ? "--enable_workspace=false"
  test_flags:
    <<: *tools_flags
    ? "--enable_bzlmod"
    ? "--enable_workspace=false"
  <<: *tools
rules: &rules
  name: "Rules"
  build_targets:
    - "//rules/..."
  test_targets:
    - "//test/rules/..."
    # Resource processor tests need an extra flag for now,
    # due to legacy compatibility reasons.
    - "-//test/rules/resources/..."
  build_flags:
    <<: *rules_flags
  test_flags:
    <<: *rules_flags
resource_rules: &resource_rules
  name: "Resource Rules"
  build_targets:
    - "//test/rules/resources/..."
  test_targets:
    - "//test/rules/resources/..."
  build_flags:
    <<: *rules_flags
    ? "--//rules/flags:manifest_merge_order=legacy"
  test_flags:
    <<: *rules_flags
    ? "--//rules/flags:manifest_merge_order=legacy"
rules_coverage: &rules_coverage
  coverage_targets:
    - "//test/rules/android_local_test/java/com/..."
  coverage_flags:
    <<: *rules_flags
    ? "--enable_bzlmod"
    ? "--enable_workspace=false"
rules_bzlmod: &rules_bzlmod
  name: "Rules Bzlmod"
  build_flags:
    <<: *rules_flags
    ? "--enable_bzlmod"
    ? "--enable_workspace=false"
  test_flags:
    <<: *rules_flags
    ? "--enable_bzlmod"
    ? "--enable_workspace=false"
  <<: *rules
resource_rules_bzlmod: &resource_rules_bzlmod
  name: "Resource Rules Bzlmod"
  build_targets:
    - "//test/rules/resources/..."
  test_targets:
    - "//test/rules/resources/..."
  build_flags:
    <<: *rules_flags
    ? "--enable_bzlmod"
    ? "--enable_workspace=false"
    ? "--//rules/flags:manifest_merge_order=legacy"
  test_flags:
    <<: *rules_flags
    ? "--enable_bzlmod"
    ? "--enable_workspace=false"
    ? "--//rules/flags:manifest_merge_order=legacy"

basicapp: &basicapp
  platform: ${{ platform }}
  bazel: ${{ bazel }}
  working_directory: examples/basicapp
  build_flags:
    <<: *rules_flags
  build_targets:
    - "//java/com/basicapp:basic_app"
    - "//java/com/basicapp:basic_app_bundle"
basicapp_bzlmod: &basicapp_bzlmod
  <<: *basicapp
  build_flags:
    <<: *bzlmod_flags

r8_app: &r8_app
  <<: *basicapp
  working_directory: examples/r8-optimized
  build_targets:
    - "//:r8_app"
    - "//:r8_app_bundle"
r8_app_bzlmod: &r8_app_bzlmod
  <<: *r8_app
  build_flags:
    <<: *bzlmod_flags

tasks:
  tools:
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    <<: *tools
  rules:
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    <<: *rules
  resource_rules:
    # Resource tests have macOS compatibility issues, run only on Linux
    platform: ubuntu2404
    bazel: ${{ bazel }}
    <<: *resource_rules
  tools_bzlmod:
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    <<: *tools_bzlmod
  resource_rules_bzlmod:
    # Resource tests have macOS compatibility issues, run only on Linux
    platform: ubuntu2404
    bazel: ${{ bazel }}
    <<: *resource_rules_bzlmod
  rules_bzlmod:
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    <<: *rules_bzlmod
  ubuntu_a_l_t_coverage:
    name: "Ubuntu android_local_test coverage"
    platform: ubuntu2004
    bazel: ${{ bazel }}
    <<: *rules_coverage
  macos_a_l_t_coverage:
    name: "Macos android_local_test coverage"
    platform: macos_arm64
    bazel: ${{ bazel }}
    <<: *rules_coverage
#  TODO: Make windows ALT coverage work
#  windows_a_l_t_coverage:
#    name: "Windows android_local_test coverage"
#    platform: windows
#    bazel: ${{ bazel }}
#    <<: *rules_coverage
  basicapp:
    name: "Basic app"
    <<: *basicapp
  basicapp_bzlmod:
    name: "Basic app bzlmod"
    <<: *basicapp_bzlmod
  windows_basicapp:
    name: "Basic app windows"
    platform: "windows"
    <<: *basicapp
  windows_basicapp_bzlmod:
    name: "Basic app windows bzlmod"
    platform: "windows"
    <<: *basicapp_bzlmod
  basicapp_mi_aspect:
    # Build the app using the mobile-install aspect
    name: "Basic app mobile-install aspect"
    <<: *basicapp
    build_flags:
      <<: *mi_aspect_flags
    build_targets:
      - "//java/com/basicapp:basic_app"
  r8_app:
    name: "R8 app"
    <<: *r8_app
  r8_app_bzlmod:
    name: "R8 app bzlmod"
    <<: *r8_app_bzlmod
  windows_r8_app:
    name: "R8 app windows"
    platform: "windows"
    <<: *r8_app
  windows_r8_app_bzlmod:
    name: "R8 app windows bzlmod"
    platform: "windows"
    <<: *r8_app_bzlmod
  r8_app_mi_aspect:
    # Build the app using the mobile-install aspect
    name: "R8 app mobile-install aspect"
    <<: *r8_app
    build_flags:
      <<: *mi_aspect_flags
    build_targets:
      - "//:r8_app"

